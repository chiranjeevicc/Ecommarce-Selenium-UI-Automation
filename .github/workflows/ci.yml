name: Selenium Cucumber CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    # Runs the full regression suite every night at 01:30 UTC (07:00 IST)
    - cron: '30 1 * * *'
  workflow_dispatch:
    inputs:
      tags:
        description: 'Cucumber tag expression to run'
        required: false
        default: '@smoke'

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '25'
          cache: 'maven'

      - name: Set up Chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable

      - name: Run tests (headless Chrome)
        env:
          CUCUMBER_TAGS: ${{ github.event.inputs.tags || '@smoke or @regression' }}
        run: >
          mvn -B clean test
          -Dbrowser=chrome
          -Dheadless=true
          -Dcucumber.filter.tags="${CUCUMBER_TAGS}"

      - name: Upload Cucumber HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cucumber-html-report
          path: target/cucumber-reports/

      - name: Upload Extent Spark report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: extent-spark-report
          path: target/extent-reports/

      - name: Upload Surefire results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-results
          path: target/surefire-reports/
